<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiRAGAS · Links</title>
<meta name="description" content="BiRAGAS — the platform that tells biology's true story. Explore the causal-AI platform, Help Companion, and more.">
<style>
:root{--navy:#0E1636;--navy2:#1C2B4C;--gold:#C9A96A;--gold2:#A9863F;--cream:#F4EFE7;--red:#C8102E}
*{margin:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(120% 60% at 50% -8%,rgba(60,82,150,.5),rgba(12,20,44,0) 60%),linear-gradient(180deg,#111B3E,#0E1636 55%,#0B1128);
  color:#EDE6D6;min-height:100vh;display:flex;justify-content:center;padding:34px 18px 40px}
.wrap{width:100%;max-width:520px;text-align:center}
.dna{margin:0 auto 6px}
.brand{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em;
  background:linear-gradient(180deg,#F7E9C4,#E9CE92 30%,#C9A96A 58%,#A9863F 82%,#E7D9B0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.brand .dot{color:var(--red);-webkit-text-fill-color:var(--red)}
.tag{font-style:italic;font-size:16px;color:#EDE6D6;margin-top:8px}
.sub{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#AFC0E0;margin-top:12px}
.links{margin-top:26px;display:flex;flex-direction:column;gap:12px}
a.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:#F3EEE3;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,169,106,.45);border-radius:14px;
  padding:15px 18px;font-weight:600;font-size:15.5px;transition:.15s;backdrop-filter:blur(4px)}
a.link:hover{background:rgba(201,169,106,.16);border-color:var(--gold);transform:translateY(-1px)}
a.link .ic{font-size:20px;width:26px;text-align:center}
a.link .tx{flex:1;text-align:left}
a.link .tx small{display:block;font-weight:400;font-size:12px;color:#AFC0E0;margin-top:1px}
a.link .go{color:var(--gold);font-size:18px}
a.primary{background:linear-gradient(180deg,#243459,#1C2B4C);border-color:var(--gold)}
.foot{margin-top:26px;font-size:12.5px;color:#9FB2D6;line-height:1.8}
.foot a{color:var(--gold);text-decoration:none}
.copy{margin-top:14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7E90B4}
</style></head>
<body><div class="wrap">
  <div class="dna">
    <svg width="72" height="90" viewBox="0 0 118 150" aria-hidden="true"><defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA0FF"/><stop offset="1" stop-color="#C9A96A"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9CE92"/><stop offset="1" stop-color="#C8102E"/></linearGradient></defs>
    <g stroke-width="3.2" fill="none"><path d="M40 8 C 80 34, 80 66, 40 92 C 0 118, 0 142, 40 148" stroke="url(#a)"/><path d="M70 8 C 30 34, 30 66, 70 92 C 110 118, 110 142, 70 148" stroke="url(#b)"/></g>
    <g stroke="rgba(233,206,146,.85)" stroke-width="2"><line x1="47" y1="18" x2="63" y2="18"/><line x1="40" y1="34" x2="70" y2="34"/><line x1="37" y1="52" x2="73" y2="52"/><line x1="40" y1="70" x2="70" y2="70"/><line x1="47" y1="86" x2="63" y2="86"/><line x1="40" y1="104" x2="70" y2="104"/><line x1="37" y1="122" x2="73" y2="122"/><line x1="47" y1="138" x2="63" y2="138"/></g></svg>
  </div>
  <div class="brand">BiRAGAS<span class="dot">.</span></div>
  <div class="tag">the platform that tells biology&rsquo;s true story</div>
  <div class="sub">Agentic&nbsp;·&nbsp;Causal&nbsp;·&nbsp;FDA-grade</div>

  <div class="links" id="links"></div>

  <div class="foot">
    Ayass Bioscience · BiRAGAS causal platform<br>
    <a href="mailto:biragas@ayassbioscience.com">biragas@ayassbioscience.com</a>
  </div>
  <div class="copy">© 2026 Ayass Bioscience</div>
</div>
<script>
// real BiRAGAS properties; links are UTM-tagged for attribution
const U="?utm_source=linkinbio&utm_medium=bio&utm_campaign=";
const LINKS=[
 ["🌐","biragas.com","Ayass Bioscience · the causal platform","https://biragas.com"+U+"home",true],
 ["🧬","The Bioinformatics Help Companion","51 real questions · from FASTQ to causal target","https://mayasss-gif.github.io/BiRAGAS-Help-Companion/"+U.replace('?','?')+"companion"],
 ["❓","51 Questions & Answers","the illustrated Q&A, question by question","https://mayasss-gif.github.io/BiRAGAS-51-Questions/"+U+"51q"],
 ["📊","Investors Brief","what investors need to know","https://mayasss-gif.github.io/BiRAGAS-Investors-Brief-Gene/"+U+"investors"],
 ["🎞️","Social Carousel","12 slides · biology's true story","https://mayasss-gif.github.io/BiRAGAS-Social-Carousel/"+U+"carousel"],
 ["🔬","BiRAGAS × CZ CELLxGENE Census","how single-cell corroborates causal targets","https://mayasss-gif.github.io/BiRAGAS-Census-Presentation/"+U+"census"],
 ["🧫","Transcriptome · RNA — live viewer","every RNA type, real data, in the browser","https://mayasss-gif.github.io/BiRAGAS-Transcriptome-RNA-Viewer/"+U+"rnaviewer"],
 ["📈","Social Media Strategy","the BiRAGAS campaign playbook","https://mayasss-gif.github.io/BiRAGAS-Social-Strategy/"+U+"strategy"],
 ["🖼️","Asset Gallery","the BiRAGAS visual asset library","https://mayasss-gif.github.io/BiRAGAS-Asset-Gallery/"+U+"gallery"],
 ["✉️","Contact us","biragas@ayassbioscience.com","mailto:biragas@ayassbioscience.com"],
];
document.getElementById('links').innerHTML=LINKS.map(([ic,t,s,href,primary])=>
 `<a class="link${primary?' primary':''}" href="${href}" ${href.startsWith('http')?'target="_blank" rel="noopener"':''}>
   <span class="ic">${ic}</span><span class="tx">${t}<small>${s}</small></span><span class="go">→</span></a>`).join('');
</script>
</body></html>
